; Trygons C2 - USB joystick bridge (Teensy 4.1).
; Build:  PlatformIO sidebar -> teensy41 -> Build   (or:  pio run)
; Upload: PlatformIO sidebar -> teensy41 -> Upload  (or:  pio run -t upload)
; See README.md for the step-by-step setup.

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; USB_SERIAL: the Teensy's own USB port is a serial console (learn mode).
build_flags = -D USB_SERIAL -Wall
monitor_speed = 115200
; Bridge watchdog (a hung bridge stops sending -> the AURIX sees a frame timeout)
lib_deps = https://github.com/tonton81/WDT_T4.git
