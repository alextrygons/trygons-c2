# Gateway PC (Ubuntu): the lid closed must keep the gateway running.
# Copy to /etc/systemd/logind.conf.d/trygons.conf, then: sudo systemctl restart systemd-logind
# (install_ubuntu.sh does it). Sleep is also masked: systemctl mask sleep.target suspend.target ...
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
