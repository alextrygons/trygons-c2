#!/usr/sbin/nft -f
# Trygons gateway firewall: nothing comes in except over the VPN (Tailscale)
# or from the boat LAN. The cameras are on their own network and never get
# out (the router blocks their internet; see README section "cameras").
flush ruleset

define boat_lan = 10.42.0.0/24

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    icmp type echo-request accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
    # the VPN: stations, web page, video, SSH
    iifname "tailscale0" tcp dport { 22, 5761, 8080, 8554, 8889 } accept
    iifname "tailscale0" udp dport { 5761, 8189 } accept
    # local stations on the boat LAN
    ip saddr $boat_lan tcp dport { 22, 5761, 8080, 8554, 8889 } accept
    ip saddr $boat_lan udp dport { 5761, 8189 } accept
    # DHCP client
    udp dport 68 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
