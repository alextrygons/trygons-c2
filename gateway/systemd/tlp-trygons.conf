# Gateway PC (Ubuntu, ThinkPad): the built-in battery is the UPS - keep it at most 80 %
# full (long life on a permanently powered laptop). Copy to /etc/tlp.d/90-trygons.conf,
# then: sudo tlp start   (install_ubuntu.sh does it). Check: sudo tlp-stat -b
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
# the USB-UART adapter (AURIX), the AIS receiver and the Ethernet adapters must never sleep
USB_AUTOSUSPEND=0
# no Wi-Fi power saving surprises; the gateway uses the cables
WIFI_PWR_ON_BAT=off
